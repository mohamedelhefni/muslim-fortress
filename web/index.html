<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>حصن المسلم</title>
  <meta name="description" content="حصن المسلم من أذكار الكتاب والسنة، مع عدّاد للتسبيح يعمل دون اتصال">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/logo.png" sizes="180x180">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&family=Noto+Naskh+Arabic:wght@400..700&display=swap">
  <script>
    // Set the theme before first paint so there is no flash.
    (function () {
      var t; try { t = localStorage.getItem('mf:theme') } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <script defer src="https://analytics.hefni101.dev/sdk/analytics.umd.min.js"></script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
